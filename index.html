<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROXY MASTER - 分流管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f1f5f9; }
        .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useMemo } = React;
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, addDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase 設定 ---
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyAPdz3bz-s3utocyQMXP4HWRtFQZYUQS9M",
            authDomain: "hua-jp-app.firebaseapp.com",
            projectId: "hua-jp-app",
            storageBucket: "hua-jp-app.firebasestorage.app",
            messagingSenderId: "967854779350",
            appId: "1:967854779350:web:2410ccda9ab280ec2dd277"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        // 確保 App ID 一致
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'proxy-master-jp';

        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        // --- 診斷用：日誌組件 ---
        const DebugLog = ({ logs }) => (
            <div className="fixed bottom-0 left-0 w-full bg-black/80 text-green-400 text-[10px] p-2 font-mono h-32 overflow-y-auto pointer-events-none z-[9999]">
                <div className="font-bold text-white border-b border-gray-600 mb-1">系統診斷日誌 (若資料未顯示請截圖此處)</div>
                {logs.map((log, i) => <div key={i}>{log}</div>)}
            </div>
        );

        // --- 組件：待歸戶倉庫的單一行 ---
        const UnassignedItemRow = ({ item, db, appId, defaultRate }) => {
            const [editData, setEditData] = useState({ 
                name: item.name, 
                jpyPrice: item.jpyPrice, 
                twdCost: item.twdCost, 
                sellingPrice: item.sellingPrice,
                recipientName: "" 
            });

            const handleSave = async () => {
                if (!editData.recipientName.trim()) {
                    alert("請填寫購買人(收件人)才能完成歸戶！");
                    return;
                }
                try {
                    const ref = doc(db, 'artifacts', appId, 'public', 'data', 'items', item.id);
                    await updateDoc(ref, {
                        name: editData.name,
                        jpyPrice: parseFloat(editData.jpyPrice),
                        twdCost: parseFloat(editData.twdCost),
                        sellingPrice: parseFloat(editData.sellingPrice),
                        recipientName: editData.recipientName.trim(), 
                        updatedAt: Date.now()
                    });
                } catch(e) { alert("歸戶失敗: " + e.message); }
            };

            const handleDelete = async () => {
                if(confirm("確定刪除此商品？")) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'items', item.id));
            };

            const handleJpyChange = (val) => {
                setEditData(prev => ({ 
                    ...prev, 
                    jpyPrice: val, 
                    twdCost: val ? Math.round(val * defaultRate) : '' 
                }));
            };

            return (
                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col gap-3 transition-all hover:shadow-md fade-in">
                    <div className="flex justify-between items-start">
                        <div className="flex-1 space-y-2">
                            <div>
                                <label className="text-[10px] text-slate-400 font-bold uppercase">商品名稱</label>
                                <input className="w-full font-bold text-slate-800 border-b border-slate-200 focus:border-blue-500 outline-none pb-1" 
                                    value={editData.name} onChange={e => setEditData({...editData, name: e.target.value})} />
                            </div>
                            <div className="grid grid-cols-3 gap-2">
                                <div>
                                    <label className="text-[10px] text-blue-400 font-bold uppercase">日幣</label>
                                    <input type="number" className="w-full font-mono text-sm bg-slate-50 rounded p-1" 
                                        value={editData.jpyPrice} onChange={e => handleJpyChange(e.target.value)} />
                                </div>
                                <div>
                                    <label className="text-[10px] text-blue-400 font-bold uppercase">台幣成本</label>
                                    <input type="number" className="w-full font-mono text-sm bg-slate-50 rounded p-1" 
                                        value={editData.twdCost} onChange={e => setEditData({...editData, twdCost: e.target.value})} />
                                </div>
                                <div>
                                    <label className="text-[10px] text-green-500 font-bold uppercase">賣價</label>
                                    <input type="number" className="w-full font-mono font-bold text-sm bg-green-50 text-green-700 rounded p-1" 
                                        value={editData.sellingPrice} onChange={e => setEditData({...editData, sellingPrice: e.target.value})} />
                                </div>
                            </div>
                        </div>
                    </div>
                    <div className="pt-3 border-t border-slate-100 flex items-center gap-2">
                        <div className="flex-1">
                             <label className="text-[10px] text-slate-400 font-bold uppercase mb-1 block">指定購買人 (歸戶)</label>
                             <div className="flex gap-2">
                                <input placeholder="輸入姓名..." className="flex-1 bg-yellow-50 border border-yellow-200 rounded-lg px-3 py-2 font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-yellow-400"
                                    value={editData.recipientName} onChange={e => setEditData({...editData, recipientName: e.target.value})} 
                                    onKeyDown={e => e.key === 'Enter' && handleSave()}
                                />
                                <button onClick={handleSave} className="bg-slate-800 text-white px-4 py-2 rounded-lg font-bold text-sm hover:bg-slate-700 flex items-center gap-1">
                                    <Icon name="archive-restore" size={16}/> 歸戶
                                </button>
                             </div>
                        </div>
                        <button onClick={handleDelete} className="p-2 text-slate-300 hover:text-red-500 mt-5"><Icon name="trash-2" size={18}/></button>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [items, setItems] = useState([]);
            const [activeTab, setActiveTab] = useState('input');
            const [defaultRate, setDefaultRate] = useState(0.22);
            const [batchName, setBatchName] = useState("");
            const [formData, setFormData] = useState({ name: '', jpyPrice: '', manualTwdPrice: '', sellingPrice: '' });
            const [logs, setLogs] = useState([]);

            const addLog = (msg) => setLogs(prev => [`[${new Date().toLocaleTimeString()}] ${msg}`, ...prev]);

            useEffect(() => {
                addLog("系統啟動，嘗試匿名登入...");
                signInAnonymously(auth)
                    .then(u => addLog(`登入成功! User ID: ${u.user.uid.slice(0,5)}...`))
                    .catch(e => addLog(`❌ 登入失敗: ${e.message}`));
                return onAuthStateChanged(auth, setUser);
            }, []);

            useEffect(() => {
                if (!user) return;
                addLog(`開始監聽資料庫: artifacts/${appId}/public/data/items`);
                const q = collection(db, 'artifacts', appId, 'public', 'data', 'items');
                
                const unsubscribe = onSnapshot(q, (snapshot) => {
                    const loadedItems = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                    setItems(loadedItems);
                    addLog(`📥 接收到資料更新: 共 ${loadedItems.length} 筆`);
                    if(loadedItems.length === 0) addLog("⚠️ 資料庫目前為空，或無讀取權限");
                }, (error) => {
                    console.error(error);
                    addLog(`❌ 資料讀取錯誤 (權限不足?): ${error.code} - ${error.message}`);
                });

                return () => unsubscribe();
            }, [user]);

            const unassignedItems = useMemo(() => items.filter(i => !i.recipientName || i.recipientName === ""), [items]);
            const assignedItems = useMemo(() => items.filter(i => i.recipientName && i.recipientName !== ""), [items]);
            
            const handleJpyChange = (val) => {
                const num = val === '' ? '' : parseFloat(val);
                setFormData(prev => ({ ...prev, jpyPrice: val, manualTwdPrice: num === '' ? '' : Math.round(num * defaultRate) }));
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!user) return alert("尚未連線，請稍候");
                
                addLog("正在存檔...");
                const pId = batchName || "無批次號";
                const newItem = { 
                    ...formData, 
                    twdCost: parseFloat(formData.manualTwdPrice || 0), 
                    parcelId: pId, 
                    sellingPrice: parseFloat(formData.sellingPrice || 0), 
                    recipientName: "", 
                    recipientShipping: 0, 
                    recipientAddress: '', 
                    isPacked: false, 
                    updatedAt: Date.now() 
                };

                try {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'items'), { ...newItem, timestamp: new Date().toLocaleString() });
                    addLog("✅ 存檔成功！");
                    setFormData(p => ({ ...p, name: '', jpyPrice: '', manualTwdPrice: '', sellingPrice: '' }));
                    setActiveTab('sorting');
                } catch (err) { 
                    console.error(err);
                    addLog(`❌ 存檔失敗: ${err.message}`);
                    alert("錯誤: " + err.message); 
                }
            };

            const shippingGroups = useMemo(() => {
                const groups = {};
                assignedItems.forEach(item => {
                    const pid = item.parcelId || "未知批次";
                    if (!groups[pid]) groups[pid] = {};
                    if (!groups[pid][item.recipientName]) groups[pid][item.recipientName] = [];
                    groups[pid][item.recipientName].push(item);
                });
                return groups;
            }, [assignedItems]);

            return (
                <div className="min-h-screen pb-40">
                    <div className="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200 px-4 py-3 shadow-sm">
                        <div className="max-w-4xl mx-auto flex justify-between items-center">
                            <h1 className="font-black text-lg italic text-slate-800 flex items-center gap-2">
                                <Icon name="truck" className="text-blue-600"/> PROXY<span className="text-blue-600">MASTER</span>
                            </h1>
                            <div className="flex items-center gap-2">
                                <div className={`flex items-center gap-1 text-[10px] font-bold px-2 py-1 rounded-full ${user ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'}`}>
                                    <div className={`w-2 h-2 rounded-full ${user ? 'bg-green-500 animate-pulse' : 'bg-red-500'}`}></div>
                                    {user ? "連線正常" : "未連線"}
                                </div>
                            </div>
                        </div>
                        <div className="max-w-4xl mx-auto mt-2 flex bg-slate-100 p-1 rounded-lg">
                            <button onClick={() => setActiveTab('input')} className={`flex-1 py-2 rounded-md text-xs font-bold transition-all ${activeTab==='input' ? 'bg-white shadow text-slate-800' : 'text-slate-400'}`}>採購錄入</button>
                            <button onClick={() => setActiveTab('sorting')} className={`flex-1 py-2 rounded-md text-xs font-bold transition-all flex justify-center items-center gap-2 ${activeTab==='sorting' ? 'bg-white shadow text-slate-800' : 'text-slate-400'}`}>
                                待歸戶倉庫
                                {unassignedItems.length > 0 && <span className="bg-red-500 text-white px-1.5 rounded-full text-[10px]">{unassignedItems.length}</span>}
                            </button>
                            <button onClick={() => setActiveTab('shipping')} className={`flex-1 py-2 rounded-md text-xs font-bold transition-all ${activeTab==='shipping' ? 'bg-white shadow text-slate-800' : 'text-slate-400'}`}>出貨管理</button>
                        </div>
                    </div>

                    <div className="max-w-4xl mx-auto px-4 pt-6">
                        {activeTab === 'input' && (
                            <div className="max-w-sm mx-auto fade-in">
                                <div className="bg-slate-800 text-white rounded-3xl p-6 shadow-2xl border border-slate-700">
                                    <h2 className="text-lg font-bold mb-6 flex items-center gap-2 text-green-400"><Icon name="plus-circle" /> 採購快速錄入</h2>
                                    <form onSubmit={handleSubmit} className="space-y-5">
                                        <div>
                                            <label className="text-xs font-bold text-slate-400 mb-1 block">批次名稱 (Batch)</label>
                                            <input required className="w-full bg-slate-700/50 border border-slate-600 rounded-xl px-4 py-3 text-white outline-none focus:border-blue-500" placeholder="例: 0121東京" value={batchName} onChange={e => setBatchName(e.target.value)} />
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-400 mb-1 block">品名</label>
                                            <input required className="w-full bg-slate-700/50 border border-slate-600 rounded-xl px-4 py-3 text-white outline-none focus:border-blue-500" placeholder="輸入商品名稱" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} />
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div><label className="text-xs font-bold text-slate-400 mb-1 block">日幣原價</label><input type="number" className="w-full bg-slate-700/50 border border-slate-600 rounded-xl px-4 py-3 text-white font-mono outline-none" value={formData.jpyPrice} onChange={e => handleJpyChange(e.target.value)} /></div>
                                            <div><label className="text-xs font-bold text-slate-400 mb-1 block">台幣成本</label><input type="number" className="w-full bg-slate-700/50 border border-slate-600 rounded-xl px-4 py-3 text-white font-mono outline-none" value={formData.manualTwdPrice} onChange={e => setFormData({...formData, manualTwdPrice: e.target.value})} /></div>
                                        </div>
                                        <div><label className="text-xs font-bold text-green-400 mb-1 block">預計賣價 (TWD)</label><input required type="number" className="w-full bg-green-900/20 border border-green-800 rounded-xl px-4 py-3 text-green-400 font-bold text-xl outline-none" placeholder="0" value={formData.sellingPrice} onChange={e => setFormData({...formData, sellingPrice: e.target.value})} /></div>
                                        <button type="submit" className="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-lg font-bold text-white shadow-lg flex justify-center items-center gap-2 mt-4"><Icon name="save" /> 存入並去歸戶</button>
                                        <div className="flex justify-between items-center text-[10px] text-slate-500 mt-2">
                                            <span>匯率: {defaultRate}</span>
                                            <input type="number" step="0.001" value={defaultRate} onChange={e => setDefaultRate(e.target.value)} className="w-16 bg-transparent text-right border-b border-slate-600 outline-none text-slate-400"/>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}

                        {activeTab === 'sorting' && (
                            <div className="fade-in">
                                <div className="mb-4 flex items-center justify-between">
                                    <h2 className="text-xl font-black text-slate-700">待歸戶商品 ({unassignedItems.length})</h2>
                                    <button onClick={() => setActiveTab('input')} className="text-xs text-blue-500 font-bold border border-blue-200 px-3 py-1 rounded-full hover:bg-blue-50">+ 繼續新增</button>
                                </div>
                                {unassignedItems.length === 0 ? (
                                    <div className="text-center py-20 bg-white rounded-3xl border border-dashed border-slate-300">
                                        <Icon name="check-circle" size={48} className="text-green-200 mx-auto mb-4"/>
                                        <p className="text-slate-400 font-bold">目前沒有待歸戶商品</p>
                                        <p className="text-xs text-slate-300 mt-2">請確認下方日誌是否有權限錯誤</p>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {unassignedItems.sort((a,b) => (b.updatedAt || 0) - (a.updatedAt || 0)).map(item => (
                                            <UnassignedItemRow key={item.id} item={item} db={db} appId={appId} defaultRate={defaultRate} />
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'shipping' && (
                            <div className="fade-in">
                                {assignedItems.length === 0 ? (
                                    <div className="text-center py-20 text-slate-400">尚無已歸戶的訂單</div>
                                ) : (
                                    Object.entries(shippingGroups).map(([pid, recipients]) => (
                                        <div key={pid} className="mb-8">
                                            <h3 className="text-lg font-black text-slate-800 mb-4 px-2 border-l-4 border-blue-500">{pid}</h3>
                                            <div className="space-y-4">
                                                {Object.entries(recipients).map(([recipient, list]) => (
                                                    <div key={recipient} className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                                        <div className="flex justify-between items-center mb-3 pb-2 border-b border-slate-100">
                                                            <div className="font-bold text-slate-700 flex items-center gap-2"><Icon name="user" size={16} className="text-blue-500"/> {recipient}</div>
                                                            <div className="text-xs font-mono text-slate-400">{list.length} 件商品</div>
                                                        </div>
                                                        <ul className="space-y-2">{list.map(item => <li key={item.id} className="flex justify-between text-sm"><span className="text-slate-600">{item.name}</span><span className="font-mono font-bold text-green-600">${item.sellingPrice}</span></li>)}</ul>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>
                        )}
                    </div>
                    <DebugLog logs={logs} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
