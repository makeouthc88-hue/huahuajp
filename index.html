<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本代購利潤管理系統 - PROXY MASTER JP</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; margin: 0; 
        }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useMemo } = React;

        // Firebase 模組化導入 (使用 ESM CDN)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, addDoc, updateDoc, deleteDoc, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase 配置 ---
        // 請直接複製貼上這一段，覆蓋原本的設定
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : {
                apiKey: "AIzaSyAPdz3bz-s3utocyQMXP4HWRtFQZYUQS9M",
                authDomain: "hua-jp-app.firebaseapp.com",
                projectId: "hua-jp-app",
                storageBucket: "hua-jp-app.firebasestorage.app",
                messagingSenderId: "967854779350",
                appId: "1:967854779350:web:2410ccda9ab280ec2dd277",
                measurementId: "G-RCN8W7D1CF"
            };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'proxy-master-jp';

        // 圖示組件封裝
        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [items, setItems] = useState([]);
            const [batchOverheads, setBatchOverheads] = useState({});
            const [isSyncing, setIsSyncing] = useState(true);
            
            const [defaultRate, setDefaultRate] = useState(0.22);
            const [batchName, setBatchName] = useState("");
            const [selectedBatchFilter, setSelectedBatchFilter] = useState("ALL");
            const [editingId, setEditingId] = useState(null);

            const [formData, setFormData] = useState({
                name: '', jpyPrice: '', manualTwdPrice: '', sellingPrice: '',
                recipientName: '', recipientPhone: '', recipientAddress: '', recipientShipping: '60'
            });

            // 認證初始化
            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (e) { console.error(e); }
                };
                initAuth();
                return onAuthStateChanged(auth, setUser);
            }, []);

            // 資料即時同步
            useEffect(() => {
                if (!user) return;
                const itemsRef = collection(db, 'artifacts', appId, 'public', 'data', 'items');
                const overheadsRef = collection(db, 'artifacts', appId, 'public', 'data', 'overheads');

                const unsubItems = onSnapshot(itemsRef, (s) => {
                    setItems(s.docs.map(d => ({ id: d.id, ...d.data() })));
                    setIsSyncing(false);
                }, (err) => console.error(err));

                const unsubOverheads = onSnapshot(overheadsRef, (s) => {
                    const obj = {};
                    s.docs.forEach(d => obj[d.id] = d.data());
                    setBatchOverheads(obj);
                });
                return () => { unsubItems(); unsubOverheads(); };
            }, [user]);

            const allBatches = useMemo(() => Array.from(new Set(items.map(i => i.parcelId))), [items]);

            const handleJpyChange = (val) => {
                const num = val === '' ? '' : parseFloat(val);
                setFormData(prev => ({ ...prev, jpyPrice: val, manualTwdPrice: num === '' ? '' : Math.round(num * defaultRate) }));
            };

            const handleTwdChange = (val) => {
                const num = val === '' ? '' : parseFloat(val);
                setFormData(prev => ({ ...prev, manualTwdPrice: val, jpyPrice: num === '' ? '' : Math.round(num / defaultRate) }));
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!user) return;
                const pId = batchName || "預設批次";
                const data = { 
                    ...formData, 
                    twdCost: parseFloat(formData.manualTwdPrice || 0), 
                    parcelId: pId, 
                    sellingPrice: parseFloat(formData.sellingPrice || 0), 
                    recipientShipping: parseFloat(formData.recipientShipping || 0), 
                    updatedAt: Date.now() 
                };

                try {
                    if (editingId) {
                        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'items', editingId), data);
                        setEditingId(null);
                    } else {
                        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'items'), { ...data, timestamp: new Date().toLocaleString() });
                    }
                    setFormData(p => ({ ...p, name: '', jpyPrice: '', manualTwdPrice: '', sellingPrice: '' }));
                } catch (err) { alert("儲存失敗：" + err.message); }
            };

            const startEdit = (item) => {
                setEditingId(item.id);
                setBatchName(item.parcelId);
                setFormData({
                    name: item.name, jpyPrice: item.jpyPrice, manualTwdPrice: item.twdCost, sellingPrice: item.sellingPrice,
                    recipientName: item.recipientName, recipientPhone: item.recipientPhone, recipientAddress: item.recipientAddress, recipientShipping: item.recipientShipping
                });
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const updateOverhead = async (pId, field, val) => {
                if (!user) return;
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'overheads', pId), { [field]: parseFloat(val || 0) }, { merge: true });
            };

            const groupedData = useMemo(() => {
                const groups = {};
                const list = selectedBatchFilter === "ALL" ? items : items.filter(i => i.parcelId === selectedBatchFilter);
                list.sort((a,b) => (b.updatedAt || 0) - (a.updatedAt || 0)).forEach(item => {
                    if (!groups[item.parcelId]) groups[item.parcelId] = {};
                    if (!groups[item.parcelId][item.recipientName]) {
                        groups[item.parcelId][item.recipientName] = { 
                            items: [], 
                            info: { phone: item.recipientPhone, address: item.recipientAddress, shipping: item.recipientShipping } 
                        };
                    }
                    groups[item.parcelId][item.recipientName].items.push(item);
                });
                return groups;
            }, [items, selectedBatchFilter]);

            return (
                <div className="min-h-screen pb-20">
                    <div className="max-w-7xl mx-auto px-4 pt-6">
                        <header className="mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div className="text-center md:text-left">
                                <h1 className="text-3xl font-black text-slate-800 italic flex items-center justify-center md:justify-start gap-2">
                                    <Icon name="package" size={28} className="text-blue-600" /> PROXY MASTER <span className="text-blue-600">JP</span>
                                </h1>
                                <p className="text-xs font-bold text-slate-400 tracking-widest uppercase mt-1">
                                    {isSyncing ? "數據連網同步中..." : "雲端資料庫已就緒"}
                                </p>
                            </div>
                            <div className="flex gap-4 bg-white p-3 rounded-2xl shadow-sm border border-slate-200 w-full md:w-auto">
                                <div className="flex-1 md:flex-none flex items-center gap-2 border-r pr-4">
                                    <Icon name="filter" size={16} className="text-slate-400" />
                                    <select className="text-sm font-bold outline-none bg-transparent w-full" value={selectedBatchFilter} onChange={e => setSelectedBatchFilter(e.target.value)}>
                                        <option value="ALL">顯示所有批次</option>
                                        {allBatches.map(b => <option key={b} value={b}>{b}</option>)}
                                    </select>
                                </div>
                                <div className="flex items-center gap-2">
                                    <span className="text-xs font-black text-slate-400">匯率</span>
                                    <input type="number" step="0.0001" value={defaultRate} onChange={e => setDefaultRate(e.target.value)} className="w-16 border-b-2 border-blue-400 text-blue-600 font-bold text-center outline-none bg-transparent" />
                                </div>
                            </div>
                        </header>

                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                            <section className="lg:col-span-4">
                                <form onSubmit={handleSubmit} className={`p-6 rounded-3xl shadow-xl border sticky top-6 transition-all ${editingId ? 'bg-amber-50 border-amber-200' : 'bg-white border-slate-200'}`}>
                                    <h2 className="text-lg font-black mb-6 border-b pb-2 flex items-center gap-2">
                                        <Icon name={editingId ? "edit-3" : "plus-circle"} className={editingId ? "text-amber-500" : "text-blue-500"} />
                                        {editingId ? "編輯項目內容" : "新採購錄入"}
                                    </h2>
                                    <div className="space-y-4">
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400 uppercase">包裹批次</label>
                                            <input required placeholder="例如: 1225東京箱" className="w-full p-2.5 bg-slate-50 border rounded-xl" value={batchName} onChange={e => setBatchName(e.target.value)} />
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400 uppercase">商品名稱</label>
                                            <input required placeholder="輸入商品名稱" className="w-full p-2.5 border rounded-xl" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} />
                                        </div>
                                        
                                        <div className="grid grid-cols-2 gap-2 bg-blue-50/50 p-3 rounded-xl border border-blue-100">
                                            <div>
                                                <label className="text-[9px] font-bold text-blue-400 uppercase">日幣原價</label>
                                                <input type="number" className="w-full p-2 rounded-lg font-mono text-lg" value={formData.jpyPrice} onChange={e => handleJpyChange(e.target.value)} />
                                            </div>
                                            <div>
                                                <label className="text-[9px] font-bold text-blue-400 uppercase">台幣成本</label>
                                                <input type="number" className="w-full p-2 rounded-lg font-mono text-lg" value={formData.manualTwdPrice} onChange={e => handleTwdChange(e.target.value)} />
                                            </div>
                                        </div>

                                        <div>
                                            <label className="text-[10px] font-bold text-green-500 uppercase">預計賣價 (TWD)</label>
                                            <input required type="number" placeholder="0" className="w-full p-2.5 border border-green-200 bg-green-50/30 rounded-xl font-bold text-green-700 text-lg" value={formData.sellingPrice} onChange={e => setFormData({...formData, sellingPrice: e.target.value})} />
                                        </div>

                                        <div className="pt-2 border-t">
                                            <label className="text-[10px] font-bold text-slate-400 uppercase mb-2 block">收件人資訊</label>
                                            <div className="grid grid-cols-2 gap-2 mb-2">
                                                <input placeholder="姓名" required className="p-2 border rounded-lg text-sm" value={formData.recipientName} onChange={e => setFormData({...formData, recipientName: e.target.value})} />
                                                <input placeholder="電話" className="p-2 border rounded-lg text-sm" value={formData.recipientPhone} onChange={e => setFormData({...formData, recipientPhone: e.target.value})} />
                                            </div>
                                            <input placeholder="地址 / 店到店代碼" className="w-full p-2 border rounded-lg text-sm mb-2" value={formData.recipientAddress} onChange={e => setFormData({...formData, recipientAddress: e.target.value})} />
                                            <div className="flex justify-between items-center bg-slate-100 p-2 rounded-lg text-xs font-bold text-slate-500">
                                                <span className="flex items-center gap-1"><Icon name="truck" size={12}/> 實收運費</span>
                                                <input type="number" className="bg-transparent text-right outline-none w-16 text-slate-800" value={formData.recipientShipping} onChange={e => setFormData({...formData, recipientShipping: e.target.value})} />
                                            </div>
                                        </div>

                                        <button type="submit" disabled={!user} className={`w-full text-white font-bold py-3 rounded-xl shadow-lg flex items-center justify-center gap-2 ${editingId ? 'bg-amber-600' : 'bg-slate-800'} disabled:opacity-50`}>
                                            <Icon name="check-circle-2" /> {editingId ? "更新並存檔" : "存入雲端清單"}
                                        </button>
                                        {editingId && <button type="button" onClick={() => setEditingId(null)} className="w-full text-slate-400 text-xs font-bold py-2 underline">取消編輯模式</button>}
                                    </div>
                                </form>
                            </section>

                            <section className="lg:col-span-8 space-y-6">
                                {Object.entries(groupedData).map(([pId, recipients]) => {
                                    const overhead = batchOverheads[pId] || { shipping: 0, tax: 0 };
                                    let totalS = 0, totalC = 0, totalShip = 0;
                                    Object.values(recipients).forEach(r => {
                                        totalShip += (r.info.shipping || 0);
                                        r.items.forEach(i => { totalS += (i.sellingPrice || 0); totalC += (i.twdCost || 0); });
                                    });
                                    const profit = (totalS + totalShip) - totalC - (overhead.shipping || 0) - (overhead.tax || 0);

                                    return (
                                        <div key={pId} className="bg-white rounded-3xl border shadow-sm overflow-hidden mb-8">
                                            <div className="bg-slate-800 p-5 text-white">
                                                <div className="flex flex-col md:flex-row justify-between gap-4">
                                                    <div className="flex items-center gap-3">
                                                        <Icon name="package" className="text-blue-400" />
                                                        <h3 className="font-black text-lg">{pId}</h3>
                                                    </div>
                                                    <div className="grid grid-cols-2 gap-3">
                                                        <div className="bg-slate-700 p-2 rounded-xl text-[10px] flex items-center gap-2">
                                                            <span>整箱運費</span>
                                                            <input type="number" value={overhead.shipping || ''} onChange={e => updateOverhead(pId, 'shipping', e.target.value)} className="bg-transparent w-12 border-b border-slate-500 text-white outline-none font-mono" />
                                                        </div>
                                                        <div className="bg-slate-700 p-2 rounded-xl text-[10px] flex items-center gap-2">
                                                            <span>整箱稅金</span>
                                                            <input type="number" value={overhead.tax || ''} onChange={e => updateOverhead(pId, 'tax', e.target.value)} className="bg-transparent w-12 border-b border-slate-500 text-white outline-none font-mono" />
                                                        </div>
                                                    </div>
                                                </div>
                                                <div className="mt-4 pt-4 border-t border-slate-700 flex justify-between items-end">
                                                    <div className="text-xs text-slate-400 font-bold uppercase">批次預估純利</div>
                                                    <div className="text-3xl font-black font-mono text-green-400">${profit.toLocaleString()}</div>
                                                </div>
                                            </div>
                                            <div className="p-4 space-y-4">
                                                {Object.entries(recipients).map(([rName, data]) => {
                                                    const pS = data.items.reduce((s, i) => s + i.sellingPrice, 0);
                                                    const pC = data.items.reduce((s, i) => s + i.twdCost, 0);
                                                    const pP = (pS + data.info.shipping) - pC;
                                                    
                                                    return (
                                                        <div key={rName} className="border rounded-2xl bg-slate-50/50 overflow-hidden">
                                                            <div className="p-3 bg-white border-b flex justify-between items-center">
                                                                <div>
                                                                    <div className="text-sm font-black text-slate-800">{rName}</div>
                                                                    <div className="text-[10px] text-slate-400 flex items-center gap-2">
                                                                        <span>{data.info.phone}</span>
                                                                        <span>|</span>
                                                                        <span className="truncate max-w-[120px]">{data.info.address}</span>
                                                                    </div>
                                                                </div>
                                                                <div className="text-right">
                                                                    <div className="text-[9px] font-bold text-slate-300 uppercase leading-none">個人訂單利潤</div>
                                                                    <div className="text-sm font-black text-green-600 font-mono">${pP}</div>
                                                                </div>
                                                            </div>
                                                            <div className="overflow-x-auto">
                                                                <table className="w-full text-xs">
                                                                    <tbody className="divide-y divide-slate-100">
                                                                        {data.items.map(item => (
                                                                            <tr key={item.id} className="hover:bg-white transition-colors">
                                                                                <td className="p-3 font-bold text-slate-700">{item.name}</td>
                                                                                <td className="p-3 text-right">
                                                                                    <div className="text-[9px] text-slate-300 font-mono">¥{item.jpyPrice}</div>
                                                                                    <div className="font-mono text-slate-500">${item.twdCost}</div>
                                                                                </td>
                                                                                <td className="p-3 text-right">
                                                                                    <div className="font-mono font-bold text-green-600">${item.sellingPrice}</div>
                                                                                </td>
                                                                                <td className="p-3 text-right flex justify-end items-center gap-1">
                                                                                    <button onClick={() => startEdit(item)} className="p-1.5 text-slate-300 hover:text-blue-500"><Icon name="edit-3" size={14}/></button>
                                                                                    <button onClick={() => { if(confirm("刪除此項？")) deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'items', item.id)) }} className="p-1.5 text-slate-200 hover:text-red-500"><Icon name="trash-2" size={14}/></button>
                                                                                </td>
                                                                            </tr>
                                                                        ))}
                                                                    </tbody>
                                                                </table>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    );
                                })}
                            </section>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
